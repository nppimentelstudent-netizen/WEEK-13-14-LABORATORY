<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Products</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .products {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .product {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 320px;
            text-align: center;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .product img {
            width: 100%;
            height: auto;
            border-radius: 5px;
        }

        .product h3 {
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1>Our Products</h1>

    <div class="products">

        <div class="product">
            <img src="product-1.webp.jpg"
                 alt="Product 1"
                 width="500"
                 height="400"
                 loading="lazy">
            <h3>Product 1</h3>
        </div>

        <div class="product">
            <img src="product-2.webp.jpg"
                 alt="Product 2"
                 width="500"
                 height="400"
                 loading="lazy">
            <h3>Product 2</h3>
        </div>

        <div class="product">
            <img src="product-3.webp.jpg"
                 alt="Product 3"
                 width="500"
                 height="400"
                 loading="lazy">
            <h3>Product 3</h3>
        </div>

    </div>

</body>
</html>
